
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass https://api-k54j.onrender.com/api/;
    proxy_ssl_server_name on;
    proxy_ssl_name api-k54j.onrender.com;

    proxy_http_version 1.1;
    proxy_set_header Host api-k54j.onrender.com;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /oidc/ {
    proxy_pass https://api-k54j.onrender.com;
    proxy_ssl_server_name on;
    proxy_ssl_name api-k54j.onrender.com;

    proxy_http_version 1.1;
    proxy_set_header Host api-k54j.onrender.com;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /.well-known/ {
    proxy_pass https://api-k54j.onrender.com;
    proxy_ssl_server_name on;
    proxy_ssl_name api-k54j.onrender.com;

    proxy_set_header Host api-k54j.onrender.com;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
